version: 2
project_name: gcpx
before:
  hooks:
    - go mod tidy
builds:
  - id: gcpx
    main: ./cmd/gcpx
    binary: gcpx
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - id: gcpx
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE*]
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
release:
  github:
    owner: luutuankiet
    name: gcpx
  draft: false
  prerelease: auto
  mode: replace
